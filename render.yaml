services:
  - type: web
    name: PRAKRUTI_HACKOPS2.0
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # Docs and ML-only commits do not change this service; skipping them avoids
    # restarting the API while people are using it.
    buildFilter:
      paths:
        - server/**
        - web/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DEMO_MODE
        value: 'true'
      - key: RIVER_BASE_URL
        value: https://api.river.ai/v1
      - key: RIVER_MODEL
        value: zai-org/GLM-5.3-Flash
      - key: RIVER_API_KEY
        sync: false
      - key: VISION_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: VISION_MODEL
        value: qwen/qwen3.8-27b
      # Cross-provider fallback: River reuses RIVER_API_KEY, so no extra secret.
      - key: VISION_FALLBACK_MODELS
        value: moonshotai/Kimi-K3,zai-org/GLM-5.3-Flash
      - key: VISION_FALLBACK_BASE_URL
        value: https://api.river.ai/v1
      - key: VISION_API_KEY
        sync: false
      - key: OPENAQ_API_KEY
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: DATA_GOV_IN_AIR_RESOURCE_ID
        value: 3b01bcb8-0b14-4abf-b6f2-c1bfd384ba69
      - key: DATABASE_URL
        fromDatabase:
          name: prakruti-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: PRAKRUTI_HACKOPS2.0
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ML_SERVICE_URL
        fromService:
          name: prakruti-ml
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ML_SERVICE_API_KEY
        fromService:
          name: prakruti-ml
          type: web
          envVarKey: ML_SERVICE_API_KEY

  - type: web
    name: prakruti-ml
    runtime: python
    plan: free
    region: oregon
    rootDir: ml
    buildCommand: pip install -r requirements-serve.txt
    startCommand: uvicorn serve:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ML_SERVICE_API_KEY
        generateValue: true

databases:
  - name: prakruti-db
    databaseName: prakruti
    user: prakruti
    plan: free
    region: oregon
    postgresMajorVersion: '16'
    ipAllowList: []
