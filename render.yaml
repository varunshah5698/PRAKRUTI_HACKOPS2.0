services:
  - type: web
    name: prakruti
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DEMO_MODE
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: prakruti-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: prakruti
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ML_SERVICE_URL
        fromService:
          name: prakruti-ml
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ML_SERVICE_API_KEY
        fromService:
          name: prakruti-ml
          type: web
          envVarKey: ML_SERVICE_API_KEY

  - type: web
    name: prakruti-ml
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./ml/Dockerfile
    dockerContext: ./ml
    healthCheckPath: /health
    envVars:
      - key: ML_SERVICE_API_KEY
        generateValue: true

databases:
  - name: prakruti-db
    databaseName: prakruti
    user: prakruti
    plan: free
    region: singapore
    postgresMajorVersion: '16'
    ipAllowList: []
