services:
  - type: web
    name: PRAKRUTI_HACKOPS2.0
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DEMO_MODE
        value: 'true'
      - key: RIVER_BASE_URL
        value: https://api.river.ai/v1
      - key: RIVER_MODEL
        value: zai-org/GLM-5.3-Flash
      - key: RIVER_API_KEY
        sync: false
      - key: VISION_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: VISION_MODEL
        value: gemini-3.5-flash
      - key: VISION_FALLBACK_MODELS
        value: gemini-3.5-flash-lite
      - key: VISION_API_KEY
        sync: false
      - key: OPENAQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: prakruti-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: PRAKRUTI_HACKOPS2.0
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ML_SERVICE_URL
        fromService:
          name: prakruti-ml
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ML_SERVICE_API_KEY
        fromService:
          name: prakruti-ml
          type: web
          envVarKey: ML_SERVICE_API_KEY

  - type: web
    name: prakruti-ml
    runtime: python
    plan: free
    region: oregon
    rootDir: ml
    buildCommand: pip install -r requirements-serve.txt
    startCommand: uvicorn serve:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ML_SERVICE_API_KEY
        generateValue: true

databases:
  - name: prakruti-db
    databaseName: prakruti
    user: prakruti
    plan: free
    region: oregon
    postgresMajorVersion: '16'
    ipAllowList: []
