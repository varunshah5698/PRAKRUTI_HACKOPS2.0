services:
  - type: web
    name: PRAKRUTI_HACKOPS2.0
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # Docs and ML-only commits do not change this service; skipping them avoids
    # restarting the API while people are using it.
    buildFilter:
      paths:
        - server/**
        - web/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      # false so real citizens receive mail. A fresh database needs
      # `npm run db:seed` once (or temporarily set this true).
      - key: DEMO_MODE
        value: 'false'
      - key: RIVER_BASE_URL
        value: https://api.river.ai/v1
      - key: RIVER_MODEL
        value: zai-org/GLM-5.3-Flash
      - key: RIVER_API_KEY
        sync: false
      - key: VISION_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: VISION_MODEL
        value: qwen/qwen3.8-27b
      # Cross-provider fallback: River reuses RIVER_API_KEY, so no extra secret.
      - key: VISION_FALLBACK_MODELS
        value: moonshotai/Kimi-K3,zai-org/GLM-5.3-Flash
      - key: VISION_FALLBACK_BASE_URL
        value: https://api.river.ai/v1
      - key: VISION_API_KEY
        sync: false
      - key: OPENAQ_API_KEY
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: DATA_GOV_IN_AIR_RESOURCE_ID
        value: 3b01bcb8-0b14-4abf-b6f2-c1bfd384ba69
      - key: DATABASE_URL
        fromDatabase:
          name: prakruti-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: PRAKRUTI_HACKOPS2.0
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ML_SERVICE_URL
        fromService:
          name: prakruti-ml
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ML_SERVICE_API_KEY
        fromService:
          name: prakruti-ml
          type: web
          envVarKey: ML_SERVICE_API_KEY
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Google Console must allow <RENDER_EXTERNAL_URL>/api/v1/auth/google/callback.
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: EMAIL_PROVIDER
        value: gmail
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '465'
      - key: SMTP_SECURE
        value: 'true'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DEMO_EMAIL_RECIPIENT
        sync: false
      # The monitor runs inside this web process. Render's free plan suspends
      # idle services, which also stops alerts; use an always-on plan for the
      # production guarantee.
      - key: CITIZEN_MONITOR_ENABLED
        value: 'true'
      - key: CITIZEN_MONITOR_INTERVAL_SECONDS
        value: '300'
      - key: CITIZEN_MONITOR_MIN_SEVERITY
        value: HIGH
      - key: CITIZEN_MONITOR_COOLDOWN_MINUTES
        value: '360'
      - key: CITIZEN_MONITOR_MAX_RETRIES
        value: '5'
      - key: NEWS_MONITOR_ENABLED
        value: 'true'
      - key: NEWS_MONITOR_INTERVAL_SECONDS
        value: '900'
      - key: NEWS_MONITOR_COOLDOWN_MINUTES
        value: '360'
      - key: NEWS_MONITOR_MAX_ITEMS
        value: '3'

  - type: web
    name: prakruti-ml
    runtime: python
    plan: free
    region: oregon
    rootDir: ml
    buildCommand: pip install -r requirements-serve.txt
    startCommand: uvicorn serve:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ML_SERVICE_API_KEY
        generateValue: true

databases:
  - name: prakruti-db
    databaseName: prakruti
    user: prakruti
    plan: free
    region: oregon
    postgresMajorVersion: '16'
    ipAllowList: []
