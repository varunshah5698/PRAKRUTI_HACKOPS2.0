services:
  db:
    # Multi-arch PostGIS image; the official image is amd64-only on Apple Silicon.
    image: imresamu/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: enviropulse
      POSTGRES_PASSWORD: enviropulse_local_only
      POSTGRES_DB: enviropulse
    ports:
      - "5433:5432"
    volumes:
      - enviropulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enviropulse -d enviropulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: http://localhost:4000
      DATABASE_URL: postgresql://enviropulse:enviropulse_local_only@db:5432/enviropulse
      JWT_SECRET: ${JWT_SECRET:-replace-this-docker-secret-before-use-1234567890}
      SESSION_SECRET: ${SESSION_SECRET:-replace-this-docker-session-secret-1234567890}
      DEMO_MODE: ${DEMO_MODE:-true}
      LIVE_ENABLED: ${LIVE_ENABLED:-true}
      LIVE_WEATHER_INTERVAL_SECONDS: ${LIVE_WEATHER_INTERVAL_SECONDS:-60}
      LIVE_AQI_INTERVAL_SECONDS: ${LIVE_AQI_INTERVAL_SECONDS:-300}
      LIVE_AIR_QUALITY_INTERVAL_SECONDS: ${LIVE_AIR_QUALITY_INTERVAL_SECONDS:-900}
      LIVE_SIMULATION_INTERVAL_SECONDS: ${LIVE_SIMULATION_INTERVAL_SECONDS:-60}
      RUN_SEED: ${RUN_SEED:-true}
      RIVER_BASE_URL: ${RIVER_BASE_URL:-https://api.river.ai/v1}
      RIVER_MODEL: ${RIVER_MODEL:-zai-org/GLM-5.3-Flash}
      RIVER_API_KEY: ${RIVER_API_KEY:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      DATA_GOV_IN_API_KEY: ${DATA_GOV_IN_API_KEY:-}
      DATA_GOV_IN_AIR_RESOURCE_ID: ${DATA_GOV_IN_AIR_RESOURCE_ID:-3b01bcb8-0b14-4abf-b6f2-c1bfd384ba69}
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-}
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-}
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL:-https://api.open-meteo.com}
      OPEN_METEO_AIR_QUALITY_BASE_URL: ${OPEN_METEO_AIR_QUALITY_BASE_URL:-https://air-quality-api.open-meteo.com}
      MAP_STYLE_URL: ${MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-gmail}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_API_BASE_URL: ${BREVO_API_BASE_URL:-https://api.brevo.com/v3}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: "${EMAIL_FROM:-Mumbai EnviroPulse <alerts@enviropulse.local>}"
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-प्रकृति}
      DEMO_EMAIL_RECIPIENT: ${DEMO_EMAIL_RECIPIENT:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      CITIZEN_MONITOR_ENABLED: ${CITIZEN_MONITOR_ENABLED:-true}
      CITIZEN_MONITOR_INTERVAL_SECONDS: ${CITIZEN_MONITOR_INTERVAL_SECONDS:-300}
      CITIZEN_MONITOR_MIN_SEVERITY: ${CITIZEN_MONITOR_MIN_SEVERITY:-HIGH}
      CITIZEN_MONITOR_COOLDOWN_MINUTES: ${CITIZEN_MONITOR_COOLDOWN_MINUTES:-360}
      CITIZEN_MONITOR_MAX_RETRIES: ${CITIZEN_MONITOR_MAX_RETRIES:-5}
      NEWS_MONITOR_ENABLED: ${NEWS_MONITOR_ENABLED:-true}
      NEWS_MONITOR_INTERVAL_SECONDS: ${NEWS_MONITOR_INTERVAL_SECONDS:-900}
      NEWS_MONITOR_COOLDOWN_MINUTES: ${NEWS_MONITOR_COOLDOWN_MINUTES:-360}
      NEWS_MONITOR_MAX_ITEMS: ${NEWS_MONITOR_MAX_ITEMS:-3}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-}
    ports:
      - "4000:4000"
    volumes:
      - enviropulse_evidence:/app/server/storage/evidence

  ml:
    profiles: ["ml"]
    build:
      context: ./ml
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-}
    volumes:
      - ./ml/artifacts:/app/artifacts:ro
    ports:
      - "8000:8000"

volumes:
  enviropulse_pgdata:
  enviropulse_evidence:
